services:
  relay:
    # Prebuilt image from GitHub Action (GHCR). No local build needed.
    image: ghcr.io/EC061/relay-docker:latest
    container_name: tunnel-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GUI_USER: admin
      GUI_PASS: change-me-now
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - ./data:/data
